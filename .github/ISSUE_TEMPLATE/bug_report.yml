name: Bug Report
description: Report a bug in the Desktop Tracking System
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the form below.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which application is affected?
      options:
        - Desktop Agent (tracking-agent)
        - Backend Server (tracking-server)
        - Frontend (tracking-frontend)
        - Other / Multiple
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide environment details.
      placeholder: |
        - OS: [e.g. Windows 11]
        - Java version: [e.g. 21]
        - Node version: [e.g. 20]
        - Browser (if frontend): [e.g. Chrome 120]
        - Version/commit: [e.g. 12fc3d0]
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant log output. Do not include sensitive data.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched for existing issues about this bug
          required: true
        - label: I have provided steps to reproduce
          required: true
