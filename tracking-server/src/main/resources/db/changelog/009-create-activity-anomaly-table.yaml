databaseChangeLog:

  - changeSet:
      id: 009-001-create-activity-anomaly-table
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: activity_anomaly
      changes:
        - createTable:
            tableName: activity_anomaly
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: employee_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: device_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: anomaly_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: anomaly_type
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: confidence_score
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: reason_summary
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: needs_review
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: activity_anomaly
            baseColumnNames: employee_id
            referencedTableName: employee
            referencedColumnNames: id
            constraintName: fk_activity_anomaly_employee

        - addForeignKeyConstraint:
            baseTableName: activity_anomaly
            baseColumnNames: device_id
            referencedTableName: device
            referencedColumnNames: id
            constraintName: fk_activity_anomaly_device

        - addUniqueConstraint:
            tableName: activity_anomaly
            columnNames: device_id, anomaly_date, anomaly_type
            constraintName: uq_activity_anomaly_device_date_type

        - createIndex:
            tableName: activity_anomaly
            indexName: idx_activity_anomaly_employee_date
            columns:
              - column:
                  name: employee_id
              - column:
                  name: anomaly_date

        - createIndex:
            tableName: activity_anomaly
            indexName: idx_activity_anomaly_needs_review
            columns:
              - column:
                  name: needs_review
