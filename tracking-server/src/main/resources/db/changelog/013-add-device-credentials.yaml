databaseChangeLog:

  - changeSet:
      id: 013-add-device-credentials
      author: rupesh

      changes:

        - addColumn:
            tableName: device
            columns:

              - column:
                  name: device_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false

              - column:
                  name: secret_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false

              - column:
                  name: last_auth_at
                  type: TIMESTAMP

              - column:
                  name: last_sync_at
                  type: TIMESTAMP

              - column:
                  name: secret_rotated_at
                  type: TIMESTAMP

              - column:
                  name: secret_version
                  type: INTEGER
                  defaultValue: 1
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: device
            constraintName: uq_device_device_id
            columnNames: "device_id"


        - createIndex:
            tableName: device
            indexName: idx_device_status
            columns:
              - column:
                  name: status
