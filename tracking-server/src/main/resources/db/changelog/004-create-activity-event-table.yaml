databaseChangeLog:

  - changeSet:
      id: 004-create-activity-event-table
      author: rupesh

      changes:

        - createTable:
            tableName: activity_event

            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: device_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: started_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: ended_at
                  type: TIMESTAMP

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: activity_event
            baseColumnNames: device_id

            referencedTableName: device
            referencedColumnNames: id

            constraintName: fk_activity_event_device

        - createIndex:
            tableName: activity_event
            indexName: idx_activity_device

            columns:
              - column:
                  name: device_id

        - createIndex:
            tableName: activity_event
            indexName: idx_activity_started

            columns:
              - column:
                  name: started_at

        - createIndex:
            tableName: activity_event
            indexName: idx_activity_ended

            columns:
              - column:
                  name: ended_at

        - createIndex:
            tableName: activity_event
            indexName: idx_activity_status

            columns:
              - column:
                  name: status